[project]
name = "governed-analytics-agent"
version = "0.1.0"
description = "Governed text-to-SQL analytics agent over BigQuery thelook_ecommerce"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-bigquery>=1.12.1",
    "dbt-metricflow[dbt-bigquery]>=0.15.0",
    "google-cloud-bigquery>=3.46.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pyyaml>=6.0.3",
    "ruff",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# A mistyped marker would otherwise silently run an opt-in test under `make test`.
addopts = "--strict-markers"
# Opt-in only: `make test` deselects both, `make test-integration` selects them.
markers = [
    "bq: needs live BigQuery (application-default credentials and impersonation)",
    "integration: needs local services such as Postgres (`make up`)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ holds illustrative snippets, not code we run.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
# Understands BaseSettings: fields may come from env vars, not __init__ args.
plugins = ["pydantic.mypy"]
