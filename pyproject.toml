[project]
name = "governed-analytics-agent"
version = "0.1.0"
description = "Governed text-to-SQL analytics agent over BigQuery thelook_ecommerce"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-bigquery>=1.12.1",
    "dbt-metricflow[dbt-bigquery]>=0.15.0",
    "google-cloud-bigquery>=3.46.2",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs live GCP credentials; skipped when they are absent",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ holds illustrative snippets, not code we run.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
